services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: campaign_data
      POSTGRES_USER: ads_demo
      POSTGRES_PASSWORD: ads_demo
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ads_demo -d campaign_data"]
      interval: 3s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/anomaly-detection-dashboard.json
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /var/lib/grafana/dashboards
        awk '{gsub(/\$$\{DS_POSTGRESQL\}/,"local-postgres")}1' /mnt/anomaly-detection-dashboard.json \
          > /var/lib/grafana/dashboards/anomaly-detection-dashboard.json
        exec /run.sh
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/anomaly-detection-dashboard.json:/mnt/anomaly-detection-dashboard.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
